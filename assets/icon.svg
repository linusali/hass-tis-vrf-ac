<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6F4FF"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect width="256" height="256" rx="58" fill="url(#shine)"/>

  <!-- indoor unit -->
  <rect x="38" y="58" width="180" height="76" rx="24" fill="url(#unit)"/>
  <rect x="62" y="110" width="132" height="9" rx="4.5" fill="#2563EB" fill-opacity="0.22"/>
  <circle cx="190" cy="82" r="6.5" fill="#06B6D4"/>

  <!-- airflow -->
  <g fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round">
    <path d="M86 152 c0 11 -11 16 -11 27 s11 16 11 27"/>
    <path d="M128 152 c0 11 -11 16 -11 27 s11 16 11 27" stroke-opacity="0.85"/>
    <path d="M170 152 c0 11 -11 16 -11 27 s11 16 11 27" stroke-opacity="0.7"/>
  </g>
</svg>
